name: Android build and tests

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  push:
    branches: ["feat/care-solt-android-mvp", "feat/android-supabase-auth-bookings"]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Set these repository Actions Variables to configure downloadable builds.
      # They are public client configuration only; never put a service-role key here.
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Verify Gradle project
        run: gradle -p android projects
      - name: Run unit tests
        run: gradle -p android :app:testDebugUnitTest
      - name: Check Supabase build configuration
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Supabase client configuration is present."
          else
            echo "Supabase client configuration is missing; APK will show setup-required state."
          fi
      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: caresolt-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
